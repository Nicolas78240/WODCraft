# Each pair is bidirectional (43 kg -> 95 lb and 95 lb -> 43 kg). A value appears at most
# once on each side, so the mapping is a bijection. Compilers apply this table first and
# fall back to arithmetic conversion rounded to 0.5 kg / 1 lb / 1 cm / 1 in.


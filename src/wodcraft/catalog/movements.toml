# WODCraft 1.0 — movement catalog
#
# Part of the WODCraft standard (see spec/SPEC.md §11). Implementations MUST accept
# every entry below and MUST NOT accept movement names outside this catalog.
#
# One TOML table per movement, keyed by a unique snake_case identifier:
#
#   [movements.thruster]
#   name       = "Thruster"        canonical English name, sentence case
#   aliases    = [...]             English aliases, lowercase. Simple plurals ("s") are
#                                  handled by the resolver and are NOT listed. Spelling
#                                  variants and abbreviations are ("pullup", "pull up",
#                                  "t2b", "hspu", "du", "c2b"...).
#   fr         = [...]             common French aliases, lowercase. The FIRST one is what
#                                  `wodc show --lang fr` displays, so put the best name first.
#   family     = "W"               M = monostructural, G = gymnastics, W = weightlifting/loaded
#   quantities = ["reps"]          ordered subset of reps | distance | calories | time
#   param      = "load"            what the movement expects after its name:
#                                  load | height | none, or a list when both are
#                                  accepted (wall ball: ball weight and target height)
#   equipment  = "barbell"         barbell | dumbbell | kettlebell | medicine_ball |
#                                  bodyweight | rower | bike | ski | rope | box | rings |
#                                  bar | sandbag | sled | other
#   rx         = { men = 43, women = 30, unit = "kg" }
#                                  OPTIONAL usual Rx reference: load in kg, or height in cm
#                                  when param = "height". Omitted for max-effort lifts
#                                  (deadlift, back squat...) where no standard Rx exists.
#   pace       = { rep = 2.5 }     average seconds per unit for an average Rx athlete in a
#                                  metcon. Keys: rep | m | cal, one per non-time quantity.
#
# No alias (English or French) may be shared by two movements, nor equal another
# movement's canonical name, after lowercasing and removing a trailing "s".
# `Rest` is NOT a movement: it is a language construct (spec §8).

